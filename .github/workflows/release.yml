name: 发布 Release

# 推送 v 开头的标签（如 v1.0.0）时触发：自动打包并创建 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 Release 需要写权限

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'  # 强制 Python 使用 UTF-8，避免 CI 英文系统下打印中文报 UnicodeEncodeError
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史与标签，便于定位上一版本生成 Full Changelog 对比链接
          fetch-tags: true

      - name: 校验标签与程序版本号一致
        shell: pwsh
        run: |
          $content = Get-Content -Path 'src/main.py' -Raw -Encoding UTF8
          if ($content -match "__version__\s*=\s*'([^']+)'") {
            $version = $Matches[1]
          } else {
            Write-Error "未能从 src/main.py 中解析到 __version__，请检查代码"
            exit 1
          }
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "标签 $env:GITHUB_REF_NAME 与 src/main.py 中的版本号（v$version）不一致，请先统一版本号再发布"
            exit 1
          }
          Write-Host "版本校验通过：$env:GITHUB_REF_NAME"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 打包程序
        run: python scripts/build_exe.py

      - name: 生成发布说明（提取 CHANGELOG.md 中当前版本的段落）
        run: python scripts/extract_changelog.py $env:GITHUB_REF_NAME release_notes.md

      - name: 删除同名的旧 Release（重推同一标签时先清理，保证发布幂等）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:GITHUB_REF_NAME --yes 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "不存在旧 Release，跳过清理"
          }

      - name: 创建 Release 并上传发布包（正文取自 CHANGELOG.md 提取的发布说明）
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: release_notes.md
