# =====================================================================
# U盘备份工具 - 示例配置文件
# =====================================================================
# 使用方法：
#   1. 将本文件复制或重命名为同目录下的 config.ini
#      （在项目目录执行命令：copy config.example.ini config.ini）
#   2. 按下方注释修改备份策略
#   3. 重新运行 main.py 使配置生效
#
# 说明：
#   - 每个段落（如 [strategy.1]）代表一条备份策略，可自由增加、删除或调整顺序
#   - 段落名仅用于区分不同策略，可任意命名（示例中采用 strategy.1 ~ strategy.4 编号），不影响功能
#   - 支持 # 或 ; 开头的整行注释与行内注释
#   - 未创建 config.ini 时，程序以空策略运行（不处理任何文件）并提示创建方法
#
# 字段说明：
#   suffix                       必填，文件后缀名，多个用英文逗号分隔（不区分大小写，不需要写点号）
#   backup_type                  必填，操作类型：
#                                    copy   = 复制到备份路径，保留U盘中的原文件
#                                    move   = 移动到备份路径，U盘中不再保留
#                                    delete = 直接删除文件（不需要 backup_path）
#   backup_path                  选填，备份目标路径（delete 类型不需要）
#                                    支持环境变量（如 %USERPROFILE%，即当前用户的文件夹）
#                                    与 ~ 前缀，程序加载配置时会自动展开为实际路径
#   target_sub_folder_name_rule  选填，子文件夹命名规则：
#                                    every_day  = 按每个文件的修改日期分文件夹（YYYY.MM.DD）
#                                    every_time = 按本次备份文件的时间范围生成统一子文件夹
#                                                 （详细说明与示例见下方 every_time 规则说明）
#                                    留空或不填 = 直接放入 backup_path 根目录
#
# ---------------------------------------------------------------------
# every_time 规则说明（本次备份的文件集中放入同一个子文件夹）
# ---------------------------------------------------------------------
# 含义：备份时统计本次待备份文件的修改时间，取其中最早与最晚的日期拼接成
#       子文件夹名，本次备份的文件全部放进这一个文件夹，不再按天拆分。
#       备份开始时会提示输入自定义名称（可直接回车跳过），输入后追加到
#       子文件夹名末尾，便于标记这批文件的来源（如某次旅行、某次活动）。
#
# 子文件夹命名格式（按时间范围的跨度自动选择）：
#   - 文件都在同一天：2026.09.18
#   - 同月跨多天：2026.09.15-18
#   - 同年跨月：2026.08.30-09.15
#   - 跨年：2025.12.28-2026.01.05
#   - 输入自定义名称时：2026.09.15-18 旅行（自定义名称与日期用空格分隔）
#
# 示例：U盘中待备份的视频文件分别在 9月15日、17日、18日拍摄，
#       执行备份时输入自定义名称“旅行”，则这批视频全部备份到：
#       %USERPROFILE%\Videos\Captures\2026.09.15-18 旅行\
#       下次备份新拍的文件时，会按新的时间范围生成另一个子文件夹。
#       使用主菜单“备份所有U盘文件”时，时间范围会跨所有U盘合并计算。
#
# 与 every_day 的区别：
#   every_day  = 按文件各自的修改日期拆分，每天一个文件夹，适合日常流水归档
#   every_time = 按备份批次集中存放，一批一个文件夹，适合一次外拍/活动的集中管理
# =====================================================================

[strategy.1]
# 照片：复制到备份目录，按拍摄日期分文件夹
suffix = jpg, jpeg
backup_type = copy
backup_path = D:\Backup\Photos
target_sub_folder_name_rule = every_day

[strategy.2]
# 视频：移动到视频目录，按本次备份的时间范围生成统一子文件夹
suffix = mov, mp4
backup_type = move
backup_path = %USERPROFILE%\Videos\Captures
target_sub_folder_name_rule = every_time

[strategy.3]
# RAW 照片：移动到照片目录，与视频同理
suffix = dng, orf
backup_type = move
backup_path = %USERPROFILE%\Pictures\相机
target_sub_folder_name_rule = every_time

[strategy.4]
# LRF 缩略文件：直接删除
suffix = lrf
backup_type = delete
