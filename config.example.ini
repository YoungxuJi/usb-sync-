# =====================================================================
# 相机照片导入自动化 - 示例配置文件
# =====================================================================
# 使用方法：
#   1. 将本文件复制或重命名为同目录下的 config.ini
#      （在项目目录执行命令：copy config.example.ini config.ini）
#   2. 按下方注释修改备份策略
#   3. 重新运行 main.py 使配置生效
#
# 说明：
#   - 每个 [strategy.xxx] 段落代表一条备份策略，可自由增加、删除或调整顺序
#   - 段落名可自定义，仅用于标识，不影响功能
#   - 支持 # 或 ; 开头的整行注释与行内注释
#   - 未创建 config.ini 时，程序以空策略运行（不处理任何文件）并提示创建方法
#
# 字段说明：
#   suffix                       必填，文件后缀名，多个用英文逗号分隔（不区分大小写，不需要写点号）
#   backup_type                  必填，操作类型：
#                                    copy   = 复制到备份路径，保留U盘中的原文件
#                                    move   = 移动到备份路径，U盘中不再保留
#                                    delete = 直接删除文件（不需要 backup_path）
#   backup_path                  选填，备份目标路径（delete 类型不需要）
#   target_sub_folder_name_rule  选填，子文件夹命名规则：
#                                    every_day  = 按每个文件的修改日期分文件夹（YYYY.MM.DD）
#                                    every_time = 按本次备份文件的时间范围生成统一子文件夹
#                                    留空或不填 = 直接放入 backup_path 根目录
# =====================================================================

[strategy.jpg]
# 照片：复制到备份目录，按拍摄日期分文件夹
suffix = jpg, jpeg
backup_type = copy
backup_path = D:\backup\jpg
target_sub_folder_name_rule = every_day

[strategy.video]
# 视频：移动到视频目录，按本次备份的时间范围生成统一子文件夹
suffix = mov, mp4
backup_type = move
backup_path = D:\35906\Videos\Captures
target_sub_folder_name_rule = every_time

[strategy.raw]
# RAW 照片：移动到照片目录，与视频同理
suffix = dng, orf
backup_type = move
backup_path = D:\35906\Pictures\相机
target_sub_folder_name_rule = every_time

[strategy.delete_lrf]
# LRF 缩略文件：直接删除
suffix = lrf
backup_type = delete
